services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  artemis:
    image: apache/activemq-artemis:2.40.0-alpine
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8161 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      BROKER_URL: tcp://artemis:61616
      BROKER_USER: admin
      BROKER_PASSWORD: admin
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USER: notifications
      DB_PASSWORD: notifications
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy

volumes:
  postgres-data:
